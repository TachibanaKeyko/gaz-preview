<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ГАЗ-РЕМОНТ — пример ролика</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1420; color: #dfe6f0; font: 16px/1.5 system-ui, sans-serif; }
  main { width: min(960px, 100% - 32px); padding: 24px 0; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #8d9ab0; font-size: 14px; }
  video { width: 100%; border-radius: 12px; background: #000; display: block; box-shadow: 0 10px 40px #0008; }
</style>
</head>
<body>
<main>
  <h1>ГАЗ-РЕМОНТ — пример фрагмента визитки</h1>
  <p>5 секунд, 1280×720, со звуком</p>
  <video src="sample.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
</main>
</body>
</html>
